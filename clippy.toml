# Clippy 設定 (lint レベルは Cargo.toml。デフォルト warn 群は変更せず、ここは挙動のみ)

# #[test] 関数と #[cfg(test)] 内の unwrap を許可する (Cargo.toml で deny している場合のみ有効)
allow-unwrap-in-tests = true
# #[test] 関数と #[cfg(test)] 内の expect を許可する (tests/ の非 #[test] ヘルパは対象外)
allow-expect-in-tests = true
# #[test] 関数と #[cfg(test)] 内の panic! を許可する (tests/ の非 #[test] ヘルパは対象外)
allow-panic-in-tests = true
