[package]
name = "c-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "mp4"

[dependencies]
shiguredo_mp4 = { path = "../../" }

[build-dependencies]
# C ヘッダー (mp4.h) を Rust コードから生成するために使用する
cbindgen = { version = "0.29", default-features = false }
