name: Miri

on:
  schedule:
    # JST 12:00 (UTC 03:00), 毎日
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  miri:
    name: Miri (wasm)
    # schedule は常に実行。PR は ci: miri ラベル付きのときだけ実行する
    if: "${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ci: miri') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install nightly and miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ubuntu-24.04
          toolchain: nightly

      - name: Run miri on wasm crate
        run: make miri

  slack_notify:
    needs: [miri]
    runs-on: ubuntu-slim
    # miri がスキップされた（ラベル無し PR 等）ときは通知しない
    if: ${{ always() && needs.miri.result != 'skipped' }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ needs.miri.result }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
