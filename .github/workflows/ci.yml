name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  schedule:
    # JST 11:00 (UTC 02:00), 月–金
    - cron: "0 2 * * 1-5"

jobs:
  ci:
    name: CI
    strategy:
      matrix:
        # 最新の GA イメージで回す。
        # macOS は Xcode のメジャーバージョンごとのイメージ (xcode-27) を選ぶ。
        # Windows は Visual Studio 2026 のイメージを明示する。
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-2025-vs2026
          - xcode-27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: "1.95"

      - run: cargo fmt --all --check
      # fuzz は root の [workspace] で exclude されており `cargo *` の対象外なので個別に検査する
      - run: cargo fmt --check
        working-directory: fuzz
      - run: cargo check --workspace --exclude dump_wasm --exclude transcode_wasm --exclude fuzz
      # fuzz の check / clippy は Windows 以外で回す
      # (Windows 向けの fuzz ビルドはこの CI では未対応)
      - if: runner.os != 'Windows'
        run: cargo check --all-targets
        working-directory: fuzz
      - run: cargo build --workspace --exclude dump_wasm --exclude transcode_wasm --exclude fuzz
      - run: cargo test --workspace --exclude dump_wasm --exclude transcode_wasm --exclude fuzz
      - run: cargo clippy --workspace --exclude dump_wasm --exclude transcode_wasm --exclude fuzz -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo clippy --all-targets -- -D warnings
        working-directory: fuzz
      - run: cargo doc --workspace --exclude dump_wasm --exclude transcode_wasm --exclude fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"

  test-wasm:
    name: Test WebAssembly
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ubuntu-26.04
          toolchain: "1.95"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # wasm-bindgen の CLI は Cargo.lock に固定したクレートとバージョンを完全に一致させる必要がある
      - name: Install wasm-bindgen
        run: |
          locked_version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = \"\(.*\)\"$/\1/p;}' Cargo.lock)
          if [ "$locked_version" != "0.2.130" ]; then
            echo "Cargo.lock has wasm-bindgen ${locked_version}, but this workflow installs 0.2.130" >&2
            echo "Update ci.yml, release.yml and crates/wasm/README.md together" >&2
            exit 1
          fi
          curl -L -o wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz
          sudo mv wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/

      - name: Install wasm-opt
        run: |
          curl -L -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz
          echo "7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
          sudo mv binaryen-version_125/bin/wasm-opt /usr/local/bin/

      - name: Build WebAssembly
        run: cargo build -p wasm --target wasm32-unknown-unknown --profile release-wasm

      - name: Generate bindings
        run: |
          wasm-bindgen --target nodejs \
            --out-dir crates/wasm/pkg/node \
            target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm

      # リリース物と同じ最適化を適用した成果物をテストする
      - name: Optimize node bindings
        run: wasm-opt -Oz --strip-debug --enable-bulk-memory -o crates/wasm/pkg/node/mp4_wasm_bg.wasm crates/wasm/pkg/node/mp4_wasm_bg.wasm

      - name: Run mux.js test
        run: |
          node crates/wasm/examples/mux.js /tmp/test_output.mp4
          if [ ! -f /tmp/test_output.mp4 ]; then
            echo "Error: mux.js did not create output file"
            exit 1
          fi
          echo "mux.js completed successfully"

      - name: Run demux.js test
        run: |
          node crates/wasm/examples/demux.js /tmp/test_output.mp4
          echo "demux.js completed successfully"

      - name: Run API tests
        run: node --test crates/wasm/tests/wasm_api.test.mjs

      - name: Generate web bindings
        run: wasm-bindgen --target web --out-dir crates/wasm/pkg/web target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm

      - name: Optimize web bindings
        run: wasm-opt -Oz --strip-debug --enable-bulk-memory -o crates/wasm/pkg/web/mp4_wasm_bg.wasm crates/wasm/pkg/web/mp4_wasm_bg.wasm

      - name: Run web API tests
        run: node --test crates/wasm/tests/wasm_web.test.mjs

  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ubuntu-26.04
          toolchain: "1.95"

      # wasm-bindgen の CLI は Cargo.lock に固定したクレートとバージョンを完全に一致させる必要がある
      - name: Install wasm-bindgen
        run: |
          locked_version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = \"\(.*\)\"$/\1/p;}' Cargo.lock)
          if [ "$locked_version" != "0.2.130" ]; then
            echo "Cargo.lock has wasm-bindgen ${locked_version}, but this workflow installs 0.2.130" >&2
            echo "Update ci.yml, release.yml and crates/wasm/README.md together" >&2
            exit 1
          fi
          curl -L -o wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz
          sudo mv wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/

      - name: Install wasm-opt
        run: |
          curl -L -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz
          echo "7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
          sudo mv binaryen-version_125/bin/wasm-opt /usr/local/bin/

      - name: Build WebAssembly
        run: cargo build --profile release-wasm --package wasm --target wasm32-unknown-unknown

      - name: Generate bindings
        run: |
          wasm-bindgen --target nodejs \
            --out-dir crates/wasm/pkg/node \
            target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm
          wasm-bindgen --target web \
            --out-dir crates/wasm/pkg/web \
            target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm

      # wasm-opt は wasm-bindgen の生成物に対して適用する。
      # cargo のプロファイルで strip すると wasm-bindgen が機能を検出できないため、
      # デバッグ情報の削除はここで行う
      - name: Optimize with wasm-opt
        run: |
          for target in node web; do
            wasm-opt -Oz --strip-debug --enable-bulk-memory \
              -o "crates/wasm/pkg/${target}/mp4_wasm_bg.wasm" \
              "crates/wasm/pkg/${target}/mp4_wasm_bg.wasm"
          done

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp -r crates/wasm/pkg artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: artifacts/

  miri:
    name: Miri (WebAssembly)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup toolchain install nightly --component miri
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ubuntu-26.04
          toolchain: nightly

      - run: make miri

  slack_notify:
    needs: [ci, test-wasm, build-wasm, miri]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
