[package]
name = "shiguredo_mp4"
version = "2026.3.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "MP4 library"
homepage = "https://github.com/shiguredo/mp4-rs"
repository = "https://github.com/shiguredo/mp4-rs"
readme = "README.md"
categories = ["no-std"]

[dependencies]

[workspace]
members = [
    "crates/c-api",
    "crates/wasm",
    "examples/dump_wasm",
    "examples/transcode_wasm",
    "pbt",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
# unsafe ブロックを禁止する (c-api / wasm は workspace lint を継承しない)
unsafe_code = "deny"

[workspace.lints.clippy]
# Clippy 組み込みデフォルト (correctness / style 等の warn) はここでは触らない。
# prek / CI の `cargo clippy ... -- -D warnings` がそれらの warn を deny に昇格する。
# 以下だけ restriction グループ (単体では allow) を追加で deny する。
# `core` で済む import に `alloc` を使うことを禁止する
alloc_instead_of_core = "deny"
# 理由なし #[allow] を禁止する
allow_attributes_without_reason = "deny"
# デバッグ用マクロを本番コードに残さない
dbg_macro = "deny"
# 未完成の unimplemented! を残さない
unimplemented = "deny"

[lints]
workspace = true


# wasm リリース用のビルドプロファイル (サイズ最小化)
# cargo build --profile release-wasm --package wasm --target wasm32-unknown-unknown
[profile.release-wasm]
inherits = "release"
# LTO でクレート間の最適化を行いサイズを削減
lto = true
# 並列コンパイルを無効化して最適化の質を向上
codegen-units = 1
# 速度より出力サイズを優先
opt-level = "z"
# スタックアンワインドを省略してサイズを削減
panic = "abort"
# デバッグシンボルを削除してサイズを削減
strip = true
