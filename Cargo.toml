[package]
name = "shiguredo_mp4"
version = "2026.5.0-canary.0"
edition = "2024"
rust-version = "1.93"
description = "MP4 library"
readme = "README.md"
homepage = "https://github.com/shiguredo/mp4-rs"
repository = "https://github.com/shiguredo/mp4-rs"
license = "Apache-2.0"
categories = ["no-std"]

[workspace]
members = [
  "crates/c-api",
  "crates/wasm",
  "examples/dump_wasm",
  "examples/transcode_wasm",
  "pbt",
]
exclude = ["fuzz"]

[dependencies]

# wasm リリース用のビルドプロファイル (サイズ最小化)
# cargo build --profile release-wasm --package wasm --target wasm32-unknown-unknown
[profile.release-wasm]
inherits = "release"
# 速度より出力サイズを優先
opt-level = "z"
# デバッグシンボルを削除してサイズを削減
strip = true
# LTO でクレート間の最適化を行いサイズを削減
lto = true
# スタックアンワインドを省略してサイズを削減
panic = "abort"
# 並列コンパイルを無効化して最適化の質を向上
codegen-units = 1
