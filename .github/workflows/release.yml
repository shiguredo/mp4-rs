name: Release

on:
  push:
    tags:
      - "*"

# 同じタグに対してワークフローが重複実行された場合は先行の実行をキャンセルする
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      release-id: ${{ steps.create-release.outputs.release-id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 重複実行や再実行で既にリリースが存在する場合はそれを使う
          if gh release view ${{ steps.get_version.outputs.VERSION }} > /dev/null 2>&1; then
            release_id=$(gh release view ${{ steps.get_version.outputs.VERSION }} --json databaseId --jq '.databaseId')
          else
            if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
              release_output=$(gh release create ${{ steps.get_version.outputs.VERSION }} \
                --prerelease \
                --title "${{ steps.get_version.outputs.VERSION }}" \
                --notes "Release ${{ steps.get_version.outputs.VERSION }}")
            else
              release_output=$(gh release create ${{ steps.get_version.outputs.VERSION }} \
                --title "${{ steps.get_version.outputs.VERSION }}" \
                --notes "Release ${{ steps.get_version.outputs.VERSION }}")
            fi
            release_id=$(echo "$release_output" | grep -o 'releases/[0-9]*' | cut -d'/' -f2)
          fi
          echo "release-id=$release_id" >> $GITHUB_OUTPUT

  upload-wasm-assets:
    name: "Upload WebAssembly assets"
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show
      - run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen の CLI は Cargo.lock に固定したクレートとバージョンを完全に一致させる必要がある
      - name: Install wasm-bindgen
        run: |
          locked_version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = \"\(.*\)\"$/\1/p;}' Cargo.lock)
          if [ "$locked_version" != "0.2.130" ]; then
            echo "Cargo.lock has wasm-bindgen ${locked_version}, but this workflow installs 0.2.130" >&2
            echo "Update ci.yml, release.yml and crates/wasm/README.md together" >&2
            exit 1
          fi
          curl -L -o wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz
          sudo mv wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/

      - name: Install wasm-opt
        run: |
          curl -L -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz
          echo "7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
          sudo mv binaryen-version_125/bin/wasm-opt /usr/local/bin/

      - name: Build WebAssembly
        run: cargo build --profile release-wasm --package wasm --target wasm32-unknown-unknown

      - name: Generate bindings
        run: |
          wasm-bindgen --target nodejs \
            --out-dir crates/wasm/pkg/node \
            target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm
          wasm-bindgen --target web \
            --out-dir crates/wasm/pkg/web \
            target/wasm32-unknown-unknown/release-wasm/mp4_wasm.wasm

      # wasm-opt は wasm-bindgen の生成物に対して適用する。
      # cargo のプロファイルで strip すると wasm-bindgen が機能を検出できないため、
      # デバッグ情報の削除はここで行う
      - name: Optimize with wasm-opt
        run: |
          for target in node web; do
            wasm-opt -Oz --strip-debug --enable-bulk-memory \
              -o "crates/wasm/pkg/${target}/mp4_wasm_bg.wasm" \
              "crates/wasm/pkg/${target}/mp4_wasm_bg.wasm"
          done

      - name: Package
        run: |
          mkdir -p mp4-${{ needs.github-release.outputs.version }}_wasm
          cp -r crates/wasm/pkg/node crates/wasm/pkg/web \
            mp4-${{ needs.github-release.outputs.version }}_wasm/
          tar -czf mp4-${{ needs.github-release.outputs.version }}_wasm.tar.gz \
            mp4-${{ needs.github-release.outputs.version }}_wasm

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} \
            mp4-${{ needs.github-release.outputs.version }}_wasm.tar.gz \
            --clobber

  publish:
    needs: [github-release, upload-wasm-assets]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      id: auth
    - run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, upload-wasm-assets, publish]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
